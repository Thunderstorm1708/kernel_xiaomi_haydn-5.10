name: Publish test zip as a release

on:
  push:
    branches: [ rom-inspect ]
    paths: [ .github/workflows/release.yml ]

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: "43849541603"
      TAG: test-1
    steps:
      - name: Fetch zip and publish
        run: |
          gh run download $RUN_ID -R $GITHUB_REPOSITORY -p 'haydn-5.10-anykernel3-*' -D dl
          z=$(find dl -name '*.zip' | head -1); ls -la "$z"; sha256sum "$z" | tee sha256.txt
          gh release create "$TAG" "$z" sha256.txt -R $GITHUB_REPOSITORY \
            --target haydn-5.10 --prerelease \
            --title "haydn 5.10 test build ($TAG)" \
            --notes "Untested bring-up build from run $RUN_ID. Back up boot, vendor_boot and dtbo before flashing."
